<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bang! Bang!</title>
<meta name="theme-color" content="#808080">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="desk">
  <main id="game-area">
  <div id="win">
    <div id="title"><div class="sysbox"></div><div class="ttxt">Bang! Bang!</div><div class="mm"><span>▼</span><span>▲</span></div></div>
    <div id="menubar"></div>
    <div id="client">
      <canvas id="cv" width="512" height="391"></canvas>
      <div id="status"><span id="wind"></span><span id="next">Next shot:</span><span id="chip"></span></div>
    </div>
  </div>
  </main>
  <aside id="tools" aria-label="Painel lateral">
    <div class="side-head">
      <div class="side-mark">BB</div>
      <div><div class="side-title">Painel do jogo</div><div class="side-subtitle">PREFERÊNCIAS</div></div>
    </div>
    <section class="tool-section">
      <div class="section-title">EXIBIÇÃO</div>
      <label class="tool-label" for="language">Idioma</label>
      <select id="language" aria-label="Idioma"><option value="pt">Português (Brasil)</option><option value="en">English</option></select>
      <button id="fullscreen" class="side-button" type="button"><span class="button-icon">⛶</span><span>Tela cheia</span></button>
    </section>
    <section class="tool-section">
      <div class="section-title">JOGABILIDADE</div>
      <label class="tool-label" for="speed">Velocidade do tiro <output id="speed-value">4</output></label>
      <input id="speed" type="range" min="1" max="12" value="4">
      <div class="range-hints"><span>Lento</span><span>Rápido</span></div>
    </section>
    <div class="side-footer"><span class="status-dot"></span> Bang! Bang! <span class="footer-version">v1.0</span></div>
  </aside>
</div>
<div id="overlay" hidden></div>
<script src="assets.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
